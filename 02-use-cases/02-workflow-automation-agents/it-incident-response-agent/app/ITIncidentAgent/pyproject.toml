[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ITIncidentAgent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic[aws] >= 0.117.1, < 1.0.0",
    "aws-opentelemetry-distro >= 0.8.0, < 1.0",
    "bedrock-agentcore >= 1.0.3, < 2.0",
    "botocore[crt] >= 1.35.0, < 2.0",
    "mcp >= 1.19.0, < 2.0",
    "strands-agents[anthropic] >= 1.13.0, < 2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
